# graphs/research-pipeline.yaml 을 src/ 없이 다시 쓴 것 (#316) — state 는 인라인 필드,
# 조건은 선언식이다. 레포 그래프와 같은 라우팅을 내는지 test_declarative_graphs 가 본다.
apiVersion: aaestro/v1
kind: Graph
metadata:
  name: research-pipeline-declarative
  version: 1.0.0
  description: 질의 → 계획 → 리서치 → 작성 파이프라인 (선언식)

spec:
  mode: mission
  goal: 질의를 받아 계획 → 리서치 → 보고서 작성을 완료한다

  state:
    fields:
      query: {type: string, required: true, description: 사용자 질의}
      plan: {type: string}
      needs_research: {type: boolean, default: true}
      findings: {type: array}
      report: {type: string}

  nodes:
    - id: planner
      agent: agents/planner@0.4.0
      input_map: {query: state.query}
      output_map: {plan: output.plan, needs_research: output.needs_research}

    - id: researcher
      agent: agents/researcher@0.3.0
      input_map: {plan: state.plan}
      output_map: {findings: output.findings}

    - id: writer
      agent: agents/writer@0.4.0
      input_map: {findings: state.findings}
      output_map: {report: output.report}

  edges:
    - {from: START, to: planner}
    - {from: planner, to: researcher, condition: state.needs_research}
    - {from: planner, to: END, condition: not state.needs_research}
    - {from: researcher, to: writer}
    - {from: writer, to: END}

  connections:
    - {caller: researcher, callee: planner}
