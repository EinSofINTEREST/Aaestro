apiVersion: aaestro/v1
kind: Memoryset
metadata:
  name: run-scratch
  version: 0.1.0
  description: run scope 임시 관찰 축적

spec:
  scope: run
  index:
    embedding:
      provider: openai-compatible
      model: text-embedding-3-small
      dimensions: 1536
  retention:
    compaction:
      trigger_entries: 1000
