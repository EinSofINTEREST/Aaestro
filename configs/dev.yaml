# 개발 환경 — 로컬 Docker, in-memory checkpoint, 사람이 읽는 로그
runtime:
  backend: docker
  network: aaestro-net
  agent_base_image: aaestro/agent-base:0.1.0
  default_resources:
    cpu: "1.0"
    memory: 1Gi
  # host_limits: {cpu: "8.0", memory: 16Gi}   # 선택 — 호스트 합계 상한 (#646), 없으면 검사하지 않는다
  health_check:
    interval_s: 10          # agentd /health 폴링 주기
    timeout_s: 3
    unhealthy_threshold: 3
    startup_grace_s: 45      # 처음 Ready 가 되기 전까지는 실패해도 재시작하지 않는다 (#297)

orchestrator:
  checkpointer: memory
  max_concurrent_runs: 10
  max_service_runs: 5       # 상주 run 은 슬롯을 오래 점유하므로 별도 상한
  node_timeout_s: 300
  # 그래프 state 압축(summarize)이 접은 원문을 두는 디렉토리 — 없으면 그런 그래프는 거절된다.
  # 오케스트레이터 전용이고 자동 정리가 없다 (run 보존 기간에 맞춰 비운다)
  # state_artifact_root: ./var/state-artifacts
  service_defaults:
    idle_min_delay_s: 30
    idle_max_delay_s: 600
    max_failure_streak: 5

protocols:
  a2a:
    port_range: [9100, 9199]
  mcp:
    startup_timeout_s: 15

registry:
  backend: filesystem
  roots:
    skillsets: ./modules/skillsets
    promptsets: ./modules/promptsets
    memorysets: ./modules/memorysets
    skillpacks: ./modules/skillpacks
    decisionsets: ./modules/decisionsets
    agents: ./agents
    graphs: ./graphs
    groups: ./groups

# 결정 모델 provider — 이름 → 어댑터 kind + 옵션 (#593). manifest 의 spec.decision.provider 가 이름을 가리킨다.
# locales 는 calibration 을 통과한 언어만. 없으면 spec.decision 을 선언한 에이전트는 배포 검증에서 거절된다
# decision:
#   timeout_s: 5
#   providers:
#     jev: {kind: jev, base_url: https://api.typesafe.ai, locales: [en]}
#     posek: {kind: jev, base_url: http://posek.internal:8000, locales: [en], allow_plaintext: true}   # Jev 와 같은 와이어 — http 는 opt-in

memory:
  backend: sqlite
  index_lag_target_s: 5

observability:
  log_level: DEBUG
  log_format: pretty
  metrics_port: 9090
