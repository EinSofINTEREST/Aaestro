# 프로덕션 — 영속 checkpoint, 구조화 로그, 높은 동시성
runtime:
  backend: docker
  network: aaestro-net
  agent_base_image: aaestro/agent-base:0.1.0
  default_resources:
    cpu: "1.0"
    memory: 1Gi
  health_check:
    interval_s: 10          # agentd /health 폴링 주기
    timeout_s: 3
    unhealthy_threshold: 3
    startup_grace_s: 45      # 처음 Ready 가 되기 전까지는 실패해도 재시작하지 않는다 (#297)

orchestrator:
  checkpointer: postgres
  max_concurrent_runs: 50
  max_service_runs: 20      # 상주 run 은 슬롯을 오래 점유하므로 별도 상한
  node_timeout_s: 300
  service_defaults:
    idle_min_delay_s: 30
    idle_max_delay_s: 600
    max_failure_streak: 5

protocols:
  a2a:
    port_range: [9100, 9199]
  mcp:
    startup_timeout_s: 15

registry:
  backend: filesystem
  roots:
    skillsets: ./modules/skillsets
    promptsets: ./modules/promptsets
    memorysets: ./modules/memorysets
    skillpacks: ./modules/skillpacks
    agents: ./agents
    graphs: ./graphs
    groups: ./groups

memory:
  # DSN 은 자격증명을 담으므로 파일이 아니라 AAESTRO_MEMORY__DSN 으로 주입한다
  backend: postgres
  index_lag_target_s: 5
  run_scope_retention_days: 30

observability:
  log_level: INFO
  log_format: json
  metrics_port: 9090
