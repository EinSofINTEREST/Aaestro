# 리뷰 존재 판정의 신호 — 판정 근거가 바뀌는 리뷰 이벤트를 받아 ci-review.yml 을 workflow_run 으로 깨운다 (#578).
# 이 워크플로는 아무것도 읽거나 쓰지 않는다 (권한 없음). 판정 · status 쓰기는 기본 브랜치의 ci-review.yml 이 한다.
#
# 판정을 여기서 직접 하지 않는 이유: pull_request_review(_comment) 실행은 이벤트를 일으킨 계정 기준으로
# 승인 대기에 걸린다 — Copilot 리뷰는 매번 action_required (job 0개) 로 멈춘다 (#574 실측). 승인 대기에
# 걸려도 workflow_run 은 발생하고, 그쪽 실행은 기본 브랜치 파일로 승인 없이 돈다.
# PR 이 이 파일을 고쳐도 판정 코드는 바뀌지 않는다 — 발화를 막거나 늘릴 뿐이고, 판정은 API 로 다시 읽는다.
# workflow_run 은 이름으로 이 워크플로를 찾는다 — name 을 바꾸면 ci-review.yml 의 workflows 도 같이 바꾼다.
name: ci-review-signal

# PR 이벤트 (opened · synchronize …) 는 받지 않는다 — ci-review.yml 이 pull_request_target 으로 직접 받는다
on:
  # 판정 근거가 생기거나 사라지는 이벤트 — 리뷰 본문 수정 · 라인 코멘트 삭제 포함
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]

permissions: {}

jobs:
  signal:
    name: Review Presence Signal
    runs-on: ubuntu-latest
    steps:
      - run: echo "Review Presence is judged by ci-review.yml on the default branch"
