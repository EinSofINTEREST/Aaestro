# 벤치마크 회귀 경고 (#565) — 정보성이다. 머지 게이트가 아니고 비교 결과 · 기준선 없음 · 읽을 수 없는 입력으로는 job 이 실패하지 않는다.
# 벤치마크 테스트 자체가 실패하면 job 이 실패한다 (필수 체크가 아니라 머지는 막지 않는다).
# main push: `make bench` 결과를 기준선 아티팩트로 저장한다.
# PR: 최신 main 기준선을 내려받아 비교하고 경고 annotation · job summary 만 남긴다.
# pull_request (not _target) — fork 코드에는 쓰기 토큰 · 비밀이 없다. 아티팩트 JSON 은 신뢰하지 않는
# 입력이라 scripts/ci/bench_compare.py 가 숫자와 형식이 맞는 이름만 읽는다.
name: ci-bench

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

env:
  BASELINE_ARTIFACT: bench-baseline

jobs:
  bench:
    name: Benchmark Regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: make bench BENCH_ARGS=--benchmark-json=bench-current.json

      - name: Save baseline (main)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BASELINE_ARTIFACT }}
          path: bench-current.json
          retention-days: 90

      - name: Download latest main baseline (PR)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 기준선이 없으면 (첫 실행 · 보존 기간 만료) 받지 못해도 실패가 아니다 — 비교 단계가 건너뛴다
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci-bench.yml --branch main \
            --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty') || true
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$BASELINE_ARTIFACT" --dir baseline \
              || echo "baseline artifact not downloadable"
          else
            echo "no successful main run yet"
          fi

      - name: Compare with baseline (PR)
        if: github.event_name == 'pull_request'
        run: uv run python scripts/ci/bench_compare.py baseline/bench-current.json bench-current.json
