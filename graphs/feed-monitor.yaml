apiVersion: aaestro/v1
kind: Graph
metadata:
  name: feed-monitor
  version: 1.0.0
  description: 피드 상시 감시 → 신규 항목 분류/알림

spec:
  mode: service
  goal: 등록된 피드를 상시 감시하고 신규 항목을 분류하여 알린다

  service:
    idle:
      # 작업이 없을 때 모델 호출을 낭비하지 않는다 — busy-loop 방지
      min_delay_s: 30
      max_delay_s: 600
    max_failure_streak: 5

  state:
    schema: aaestro.graphs.schemas:FeedMonitorState

  memory:
    spaces:
      # service run 의 run scope 는 compaction 선언 필수 — 없으면 무한 성장한다
      - ref: memorysets/run-scratch@0.1.0
        as: scratch

  nodes:
    - id: watcher
      agent: agents/researcher@0.3.0
      input_map: {feeds: state.feeds}
      output_map: {new_items: output.new_items}

    - id: classifier
      agent: agents/planner@0.4.0
      input_map: {new_items: state.new_items}
      output_map: {seen_ids: output.seen_ids}

    - id: notifier
      agent: agents/writer@0.4.0
      input_map: {new_items: state.new_items}
      output_map: {notified: output.notified}

  # 한 iteration = START -> ... -> END. 반복은 그래프가 아니라 ServiceRunner 가
  # 소유한다 — 그래프가 스스로 순환하면 한 번의 실행이 끝나지 않는다
  edges:
    - {from: START, to: watcher}
    - from: watcher
      to: classifier
      condition: aaestro.graphs.conditions:has_new_items
    - from: watcher
      to: END
      condition: aaestro.graphs.conditions:idle
    - {from: classifier, to: notifier}
    - {from: notifier, to: END}
