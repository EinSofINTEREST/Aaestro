apiVersion: aaestro/v1
kind: Graph
metadata:
  name: draft-review
  version: 1.0.0
  description: 초안을 쓰고 검토해 통과할 때까지 고쳐 쓴다

spec:
  mode: mission
  goal: 질의에 대한 초안을 작성하고, 검토를 통과할 때까지 개정한다

  state:
    schema: aaestro.graphs.schemas:DraftReviewState

  nodes:
    - id: drafter
      agent: agents/writer@0.4.0
      input_map: {query: state.query, notes: state.notes}
      output_map: {draft: output.draft}

    - id: reviewer
      agent: agents/planner@0.4.0
      input_map: {draft: state.draft}
      output_map: {approved: output.approved, notes: output.notes}

  edges:
    - {from: START, to: drafter}
    - {from: drafter, to: reviewer}
    # 통과하지 못하면 검토 의견을 안고 다시 쓴다 — 04 는 순환에
    # max_iterations 를 요구한다 (미명시 시 배포 검증 실패)
    - from: reviewer
      to: drafter
      condition: aaestro.graphs.conditions:needs_revision
      max_iterations: 3
    - {from: reviewer, to: END, condition: aaestro.graphs.conditions:draft_approved}
