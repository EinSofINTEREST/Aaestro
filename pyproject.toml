[project]
name = "aaestro"
version = "0.1.0"
description = "Modular multi-agent orchestration framework on LangGraph"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}

dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.9.0",
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0",
    "tenacity>=9.0.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0.2",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "docker>=7.1.0",
    "a2a-sdk>=0.2.0",
    # 2.x 부터 streamable-http 전송이 공개 시그니처로 httpx2.AsyncClient 를 받는다 — 1.x 는
    # httpx 를 받아 protocols/mcp/sdk.py 의 인증 헤더 전달이 깨진다. 메이저 경계를 고정한다
    "mcp>=2.1.0,<3",
    # 직접 import 한다 (MCP 인증 헤더를 실을 클라이언트) — 전이 의존에만 기대지 않는다
    "httpx2>=2.5.0",
    "psycopg[binary]>=3.2.0",
    "anthropic>=0.40.0",
    "langgraph-checkpoint-postgres>=3.1.2",
    "langgraph-checkpoint-redis>=0.5.2",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-benchmark>=5.1.0",
    "types-pyyaml>=6.0.12",
    "testcontainers[postgres]>=4.8.0",
    "playwright>=1.62.0",
]

[project.scripts]
aaestro = "aaestro.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aaestro"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "ASYNC", "S", "C4", "RET", "SIM", "PTH"]

[tool.ruff.lint.isort]
known-first-party = ["aaestro", "tests"]

[tool.ruff.lint.per-file-ignores]
# 테스트는 assert 사용이 본질 (S101), 픽스처 스코프상 하드코딩 값 허용 (S105~S107)
"tests/**" = ["S101", "S105", "S106", "S107"]

[tool.mypy]
python_version = "3.12"
packages = ["aaestro"]
mypy_path = "src"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

# core 는 프레임워크 계약 — strict 필수 (06-testing.md Quality Gates)
[[tool.mypy.overrides]]
module = "aaestro.core.*"
strict = true

# docker SDK 는 타입 stub 을 싣지 않는다 — 우리 쪽 경계(client.py)에서만 쓴다
[[tool.mypy.overrides]]
module = "docker.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: Docker/실서버 fixture 를 사용하는 통합 테스트",
    "e2e: 전체 스택 E2E 테스트 (nightly)",
]
addopts = [
    "--strict-markers",
    "--cov=aaestro",
    "--cov-report=term-missing",
    "--cov-fail-under=70",
]

[tool.coverage.run]
source = ["src/aaestro"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
    "\\.\\.\\.",
]
