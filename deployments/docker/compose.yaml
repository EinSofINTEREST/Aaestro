# 개발 스택 — 에이전트 컨테이너의 격리 계약을 로컬에서 그대로 재현한다.
#
# 운영 배포용이 아니다. 실제 에이전트 기동은 runtime layer 가 Docker API 로
# 수행하며, 여기서는 base image 와 네트워크가 계약대로 동작하는지 확인한다.
name: aaestro

services:
  agent-echo:
    image: aaestro/agent-echo:${IMAGE_TAG:-0.1.0}
    build:
      context: ../..
      dockerfile: deployments/docker/agent-echo.Dockerfile
      args:
        BASE_TAG: ${IMAGE_TAG:-0.1.0}
    networks: [aaestro-net]
    ports:
      # 개발 편의를 위한 control port 노출 — 운영에서는 runtime 만 접근한다
      - "18080:8080"
    environment:
      # 개발 스택도 인증을 켠다 — 무인증으로 돌리면 인증 회귀를 못 잡는다.
      # 운영에서는 runtime 이 에이전트마다 난수 토큰을 발급해 주입한다
      AAESTRO_AGENT_TOKEN: ${AAESTRO_AGENT_TOKEN:-dev-local-token}
    read_only: true
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m
      - /workspace:size=64m
    # 02 Docker Isolation Rules 4 의 세 상한을 **한 자리에** 선언한다 —
    # `pids_limit` 과 `deploy.resources.limits.pids` 로 나눠 쓰면 compose 가
    # 값이 어긋난다며 프로젝트를 통째로 거절한다 (#226)
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
          pids: 256

networks:
  # 전용 bridge — 에이전트는 이 네트워크에만 붙는다. host 네트워크 모드 금지
  aaestro-net:
    name: aaestro-net
    driver: bridge
