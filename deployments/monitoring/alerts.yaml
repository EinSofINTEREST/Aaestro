# Aaestro alerting rules.
#
# PromQL 이 참조하는 메트릭 이름은 src/aaestro/observability/metrics.py 의
# METRIC_SPECS 가 단일 소스다 — 테스트가 이 파일의 참조를 레지스트리와 대조한다.
groups:
  - name: aaestro
    interval: 30s
    rules:
      - alert: AgentHighFailureRate
        # 분모에서 status 를 제거해야 한다 — 남겨 두면 status="failed" 끼리만
        # 벡터 매칭되어 비율이 항상 1.0 이 되고, 실패 1건에도 발화한다
        expr: |
          sum without (status) (rate(aaestro_agent_tasks_total{status="failed"}[5m]))
          /
          sum without (status) (rate(aaestro_agent_tasks_total[5m]))
          > 0.1
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Agent {{ $labels.agent }} failure rate > 10%"
          runbook: "docs/en/runbooks/incident-response.md#agenthighfailurerate"

      - alert: AgentDown
        expr: aaestro_agent_health == 0
        for: 3m
        labels: {severity: critical}
        annotations:
          summary: "Agent {{ $labels.agent }} unhealthy for 3m"
          runbook: "docs/en/runbooks/incident-response.md#agentdown"

      - alert: ContainerRestartLoop
        # reason 을 합산하지 않으면 같은 에이전트가 reason 조합별로 쪼개져 발화한다
        expr: |
          sum without (reason) (increase(aaestro_container_restarts_total[10m])) > 5
        labels: {severity: critical}
        annotations:
          summary: "Agent {{ $labels.agent }} restart loop"
          runbook: "docs/en/runbooks/incident-response.md#containerrestartloop"

      - alert: ModelRateLimited
        expr: |
          sum without (status) (
            rate(aaestro_model_requests_total{status="rate_limited"}[5m])
          ) > 1
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Agent {{ $labels.agent }} is being rate limited by {{ $labels.provider }}"
          runbook: "docs/en/runbooks/incident-response.md#modelratelimited"

      - alert: DecisionModelMostlyUncertain
        expr: |
          sum without (band) (rate(aaestro_decision_bands_total{band="uncertain"}[30m])) /
          sum without (band) (rate(aaestro_decision_bands_total[30m])) > 0.5
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.question }} on {{ $labels.agent }} is uncertain more than half the time — the bands or the wording need recalibration"
          runbook: "docs/en/runbooks/incident-response.md#decisionmodelmostlyuncertain"

      - alert: DecisionModelUnavailable
        expr: |
          sum by (agent, provider) (rate(aaestro_decision_unavailable_total[10m])) > 0.5
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Agent {{ $labels.agent }} is running without its decision model — tasks fall back to the LLM path"
          runbook: "docs/en/runbooks/incident-response.md#decisionmodelunavailable"
          runbook: "docs/en/runbooks/incident-response.md#modelratelimited"

      - alert: CheckpointFailures
        expr: |
          sum without (status) (
            rate(aaestro_checkpoint_operations_total{status="failed"}[5m])
          ) > 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Checkpoint failures — run recovery at risk"
          runbook: "docs/en/runbooks/recovery.md#checkpoint-failures"

      - alert: ServiceRunStalled
        # `and` 는 전체 라벨셋 일치를 요구한다 — 좌변은 {graph,mode}, 우변은
        # {graph,status} 라 on(graph) 없이는 교집합이 비어 영원히 발화하지 않는다
        expr: |
          sum without (mode) (aaestro_runs_active{mode="service"}) > 0
          and on (graph)
          sum without (status) (increase(aaestro_service_iterations_total[30m])) == 0
        labels: {severity: critical}
        annotations:
          summary: "Service graph {{ $labels.graph }} made no progress for 30m"
          runbook: "docs/en/runbooks/incident-response.md#servicerunstalled"

      - alert: ServiceRunHalted
        expr: |
          sum without (status) (
            increase(aaestro_service_iterations_total{status="halted"}[10m])
          ) > 0
        labels: {severity: critical}
        annotations:
          summary: "Service graph {{ $labels.graph }} halted (GRAPH_005 failure streak)"
          runbook: "docs/en/runbooks/recovery.md#service-run-halted"

      - alert: AccessRegistryUnreachable
        expr: aaestro_access_registry_reachable == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.component }} cannot reach the access registry — new decisions are denied, revocations are not applied"
          runbook: "docs/en/runbooks/incident-response.md#accessregistryunreachable"

      - alert: AccessGrantRefusalsSpike
        expr: |
          sum without (op) (increase(aaestro_access_grants_total{op="refuse"}[10m])) > 20
        labels: {severity: warning}
        annotations:
          summary: "Many refused grants — a worker agent may be trying to talk the permission agent past its ceiling"
          runbook: "docs/en/runbooks/incident-response.md#accessgrantrefusalsspike"
