apiVersion: aaestro/v1
kind: Promptset
metadata:
  name: researcher
  version: 0.2.0
  description: 계획을 근거 수집으로 옮기는 에이전트 프롬프트

spec:
  engine: jinja2
  default_locale: en
  templates:
    system:
      file: templates/system.j2
    researcher:
      file: templates/researcher.j2
      output_keys: [findings]
      variables:
        plan: {type: string, required: true}
    watcher:
      file: templates/watcher.j2
      output_keys: [new_items]
      variables:
        feeds: {type: array, required: true}
    default:
      file: templates/default.j2
      variables:
        query: {type: string, required: true}
