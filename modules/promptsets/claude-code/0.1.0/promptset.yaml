apiVersion: aaestro/v1
kind: Promptset
metadata:
  name: claude-code
  version: 0.1.0
  description: Claude Code 에이전트 프롬프트 — CLI 가 자체 시스템 프롬프트를 갖는다

spec:
  engine: jinja2
  default_locale: en
  templates:
    system:
      file: templates/system.j2
    # ClaudeCodeExecutor 는 태스크 입력에서 직접 프롬프트를 만든다 (CLI 가 자기
    # 시스템 프롬프트를 갖기 때문). 그래도 선언은 필요하다 — manifest 의
    # promptset ref 는 배포 검증 대상이다
    default:
      file: templates/default.j2
      variables:
        prompt: {type: string, required: false}
