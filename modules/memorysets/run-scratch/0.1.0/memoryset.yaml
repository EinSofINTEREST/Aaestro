apiVersion: aaestro/v1
kind: Memoryset
metadata:
  name: run-scratch
  version: 0.1.0
  description: run 범위 관찰 축적 — service 그래프는 compaction 없이 무한 성장한다

spec:
  scope: run

  index:
    embedding:
      provider: openai-compatible
      model: text-embedding-3-small
      dimensions: 1536
    chunk:
      max_tokens: 300
      overlap_tokens: 30

  retention:
    # service run 의 run scope 는 compaction 선언이 필수 (09 Compaction 4)
    compaction:
      trigger_entries: 2000
      strategy: summarize
      keep_kinds: [fact, summary]

  recall:
    auto: true
    k: 4
    min_score: 0.4
    budget_tokens: 1200
