apiVersion: aaestro/v1
kind: Agent
metadata:
  name: claude-code
  version: 0.1.0
  description: Claude Code CLI 를 실행기로 쓰는 에이전트

spec:
  model:
    provider: anthropic
    name: claude-opus-5

  promptset:
    ref: promptsets/claude-code@0.1.0

  # 02 Custom Agent — 이 클래스가 agentd 의 기본 루프를 대신한다
  entrypoint: agent:ClaudeCodeExecutor

  a2a:
    enabled: false

  runtime:
    # 빌드 단계가 굽는 태그와 **같아야** 한다 — 다르면 배포가 거절한다 (#266).
    # 재료는 저장소가 아니라 스토어에 있다: examples/materials/claude-code 를 시드로 올린다
    image: aaestro/agent-claude-code:0.1.0
    resources:
      cpu: "1.0"
      memory: 2Gi
    env_allowlist:
      - ANTHROPIC_API_KEY

    volumes:
      # Claude Code 는 API 키 대신 구독 자격증명으로도 인증한다. 그 경우
      # 이 경로가 필요하다 — **읽기 전용**이며, 02 Volumes 규칙대로 명시
      # 선언한다. 에이전트 간 공유 금지 대상이다
      - name: claude-credentials
        mount_path: /tmp/.claude
        read_only: true
