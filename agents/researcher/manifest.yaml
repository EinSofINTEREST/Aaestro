apiVersion: aaestro/v1
kind: Agent
metadata:
  name: researcher
  version: 0.3.0
  group: research
  description: 계획을 근거 수집으로 옮기는 에이전트

spec:
  model:
    provider: anthropic
    name: claude-sonnet-5
    max_tokens: 8192
    effort: high

  promptset:
    ref: promptsets/researcher@0.2.0


  skillsets:
    - ref: skillsets/web-search@0.2.0

  memory:
    spaces:
      - ref: memorysets/agent-longterm@0.1.0
        as: longterm

  a2a:
    enabled: true
    capabilities:
      streaming: true

  runtime:
    image: aaestro/agent-base:0.1.0
    resources:
      cpu: "1.0"
      memory: 1Gi
    env_allowlist:
      - ANTHROPIC_API_KEY
      - SEARCH_API_KEY   # web-search 스킬셋이 requires.env 로 요구한다
